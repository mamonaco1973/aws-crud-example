<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="590" viewBox="0 0 1620 590" role="img" aria-label="A browser loads index.html from the public notes-web S3 bucket, then calls notes-api, an API Gateway HTTP API with an auto-deployed $default stage that allows CORS from any origin. Each of its five routes on /notes and /notes/{id} invokes its own Python 3.14 Lambda function through an AWS_PROXY integration. Each function's role allows one DynamoDB action on the notes table, keyed on owner and id."><defs><marker id="a_e_page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_https" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_proxy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_role" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_ddb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs><rect width="1620" height="590" fill="#ffffff"/><path d="M600,95.0 H465" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_page)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">GET page</text><path d="M810.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_https)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTPS /notes</text><path d="M810.0,350 V435" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_proxy)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">AWS_PROXY</text><path d="M460,495.0 H595" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_role)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">assumes</text><path d="M1020,495.0 H1155" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_ddb)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">read / write</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Browser</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">index.html, or curl</text><rect x="40" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><g transform="translate(60,80.0) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g><text x="104.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">notes-web-&lt;hex&gt;</text><text x="104.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">public S3 bucket: index.html</text><rect x="600" y="240" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/><g transform="translate(620,280.0) scale(1.25)" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H12"/></g><text x="664.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">notes-api</text><text x="664.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">HTTP API, $default stage, CORS *</text><rect x="600" y="440" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><g transform="translate(620,480.0) scale(1.25)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="664.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">5 Lambda functions</text><text x="664.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">python3.14, one per route</text><rect x="40" y="440" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><g transform="translate(60,480.0) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g><text x="104.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">5 execution roles</text><text x="104.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">one DynamoDB action each</text><rect x="1160" y="440" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/><g transform="translate(1180,480.0) scale(1.25)" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="1224.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">DynamoDB</text><text x="1224.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">notes: owner + id, on-demand</text></svg>